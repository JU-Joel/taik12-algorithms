<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consecutive integer checking (60, 24) · step by step</title>
<style>
:root { --ink:#3F3F3F; --purple:#951A80; --purple-light:#F3E8F2; --teal:#2C7E91;
  --teal-light:#E2EFEE; --hl:#FFF3D1; --grey:#757679; --grey-light:#EAEAEA; }
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:#fff; }
main { max-width:1100px; margin:0 auto; padding:24px 16px 40px; }
h1 { font-size:28px; margin:0 0 4px; }
.src { color:var(--teal); font-weight:bold; margin:0 0 18px; }
.grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:20px; }
@media (max-width:760px) { .grid { grid-template-columns:1fr; } }
.panel { border:3px solid var(--purple-light); border-radius:14px; padding:16px; }
ol.code { font-family:"Courier New",monospace; font-size:18px; margin:0; padding-left:2.6em; }
ol.code li { padding:3px 8px; border-radius:6px; white-space:pre; }
ol.code li.now { background:var(--hl); outline:2px solid #C98B00; }
.kw { font-weight:bold; }
.cmt { font-family:"Courier New",monospace; font-size:16px; color:var(--grey); font-style:italic; margin:0 0 8px; white-space:pre-line; }
table { border-collapse:collapse; width:100%; font-size:18px; }
th, td { border-bottom:1px solid var(--grey-light); padding:6px 8px; text-align:right; }
th { color:var(--purple); text-align:right; }
.counter { font-size:22px; margin:12px 0 4px; }
.counter b { color:var(--purple); font-size:30px; }
.note { min-height:1.6em; font-style:italic; }
.controls { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 8px; }
button { font:inherit; font-size:18px; padding:10px 18px; border-radius:10px; border:2px solid var(--purple);
  background:#fff; color:var(--purple); cursor:pointer; }
button.primary { background:var(--purple); color:#fff; }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible { outline:3px solid var(--teal); outline-offset:2px; }
.pos { color:var(--grey); }
.result { margin-top:10px; font-weight:bold; }
</style></head>
<body><main>
<h1>Consecutive integer checking (60, 24)</h1>
<p class="src">ALGORITHM ConsecutiveIntegerChecking(m, n) · Levitin 1.1</p>
<div class="controls" role="group" aria-label="Step controls">
  <button id="reset">⏮ Start</button>
  <button id="back">◀ Back</button>
  <button id="next" class="primary">Next step ▶</button>
  <button id="play">▶ Play</button>
  <span class="pos" id="pos" aria-live="polite"></span>
</div>
<div class="grid">
  <section class="panel" aria-label="Pseudocode"><p class="cmt" id="cmt"></p><ol class="code" id="code"></ol></section>
  <section class="panel" aria-label="State">
    <table><thead><tr id="head"></tr></thead><tbody id="vars"></tbody></table>
    <p class="counter">candidates: <b id="count">0</b></p>
    <p class="note" id="note" aria-live="polite"></p>
    <p class="result" id="result" hidden>gcd = 12 after 13 candidates</p>
  </section>
</div>
<p class="pos">Keys: → or space = next step, ← = back. Every value comes from the same run as the lecture's trace table.</p>
</main>
<script>
const T = {"pseudocode": ["t \u2190 min{m, n}", "while m mod t \u2260 0 or n mod t \u2260 0 do", "    t \u2190 t \u2212 1", "return t"], "columns": ["t", "m mod t", "n mod t"], "comments": ["//Computes gcd(m, n) by consecutive integer checking", "//Input: Two nonnegative, not-both-zero integers m and n", "//Output: Greatest common divisor of m and n"], "steps": [{"line": 1, "state": {"t": "24", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 0, "note": "t = min{60, 24} = 24"}, {"line": 2, "state": {"t": "24", "m mod t": "12", "n mod t": "\u2013"}, "counter": 1, "note": "24 does not divide both"}, {"line": 3, "state": {"t": "23", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 1, "note": "try t = 23"}, {"line": 2, "state": {"t": "23", "m mod t": "14", "n mod t": "\u2013"}, "counter": 2, "note": "23 does not divide both"}, {"line": 3, "state": {"t": "22", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 2, "note": "try t = 22"}, {"line": 2, "state": {"t": "22", "m mod t": "16", "n mod t": "\u2013"}, "counter": 3, "note": "22 does not divide both"}, {"line": 3, "state": {"t": "21", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 3, "note": "try t = 21"}, {"line": 2, "state": {"t": "21", "m mod t": "18", "n mod t": "\u2013"}, "counter": 4, "note": "21 does not divide both"}, {"line": 3, "state": {"t": "20", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 4, "note": "try t = 20"}, {"line": 2, "state": {"t": "20", "m mod t": "0", "n mod t": "4"}, "counter": 5, "note": "20 does not divide both"}, {"line": 3, "state": {"t": "19", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 5, "note": "try t = 19"}, {"line": 2, "state": {"t": "19", "m mod t": "3", "n mod t": "\u2013"}, "counter": 6, "note": "19 does not divide both"}, {"line": 3, "state": {"t": "18", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 6, "note": "try t = 18"}, {"line": 2, "state": {"t": "18", "m mod t": "6", "n mod t": "\u2013"}, "counter": 7, "note": "18 does not divide both"}, {"line": 3, "state": {"t": "17", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 7, "note": "try t = 17"}, {"line": 2, "state": {"t": "17", "m mod t": "9", "n mod t": "\u2013"}, "counter": 8, "note": "17 does not divide both"}, {"line": 3, "state": {"t": "16", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 8, "note": "try t = 16"}, {"line": 2, "state": {"t": "16", "m mod t": "12", "n mod t": "\u2013"}, "counter": 9, "note": "16 does not divide both"}, {"line": 3, "state": {"t": "15", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 9, "note": "try t = 15"}, {"line": 2, "state": {"t": "15", "m mod t": "0", "n mod t": "9"}, "counter": 10, "note": "15 does not divide both"}, {"line": 3, "state": {"t": "14", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 10, "note": "try t = 14"}, {"line": 2, "state": {"t": "14", "m mod t": "4", "n mod t": "\u2013"}, "counter": 11, "note": "14 does not divide both"}, {"line": 3, "state": {"t": "13", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 11, "note": "try t = 13"}, {"line": 2, "state": {"t": "13", "m mod t": "8", "n mod t": "\u2013"}, "counter": 12, "note": "13 does not divide both"}, {"line": 3, "state": {"t": "12", "m mod t": "\u2013", "n mod t": "\u2013"}, "counter": 12, "note": "try t = 12"}, {"line": 2, "state": {"t": "12", "m mod t": "0", "n mod t": "0"}, "counter": 13, "note": "12 divides both"}, {"line": 4, "state": {"t": "12", "m mod t": "0", "n mod t": "0"}, "counter": 13, "note": "gcd = 12"}]};
const KW = new Set(["ALGORITHM", "while", "do", "for", "to", "if", "else", "return", "and", "or", "not"]);
let i = 0, timer = null;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const code = document.getElementById('code');
T.pseudocode.forEach((line) => {
  const li = document.createElement('li');
  const indent = line.length - line.trimStart().length;
  li.textContent = '';
  li.append(' '.repeat(indent));
  line.trim().split(/(\b\w+\b)/).forEach((tok) => {
    if (KW.has(tok)) { const b = document.createElement('span'); b.className = 'kw'; b.textContent = tok; li.append(b); }
    else li.append(tok);
  });
  code.append(li);
});
document.getElementById('cmt').textContent = (T.comments || []).join('
');
document.getElementById('head').innerHTML = '<th>variable</th><th>value</th>';
function show() {
  const s = T.steps[i];
  [...code.children].forEach((li, n) => li.classList.toggle('now', n + 1 === s.line));
  document.getElementById('vars').innerHTML = T.columns.map((c) =>
    `<tr><td style="text-align:left">${c}</td><td>${s.state[c] ?? '–'}</td></tr>`).join('');
  document.getElementById('count').textContent = s.counter;
  document.getElementById('note').textContent = s.note || '';
  document.getElementById('pos').textContent = `step ${i} of ${T.steps.length - 1} · line ${s.line}`;
  document.getElementById('back').disabled = i === 0;
  document.getElementById('next').disabled = i === T.steps.length - 1;
  document.getElementById('result').hidden = i !== T.steps.length - 1;
  if (i === T.steps.length - 1) stop();
}
function stop() { if (timer) { clearInterval(timer); timer = null; } document.getElementById('play').textContent = '▶ Play'; }
document.getElementById('next').onclick = () => { if (i < T.steps.length - 1) { i++; show(); } };
document.getElementById('back').onclick = () => { stop(); if (i > 0) { i--; show(); } };
document.getElementById('reset').onclick = () => { stop(); i = 0; show(); };
const play = document.getElementById('play');
if (reduce) { play.disabled = true; play.title = 'Play is off because your system asks for reduced motion'; }
play.onclick = () => {
  if (timer) { stop(); return; }
  if (i === T.steps.length - 1) i = 0;
  play.textContent = '⏸ Pause';
  timer = setInterval(() => { if (i < T.steps.length - 1) { i++; show(); } else stop(); }, 1100);
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); document.getElementById('next').click(); }
  if (e.key === 'ArrowLeft') document.getElementById('back').click();
});
show();
</script></body></html>
