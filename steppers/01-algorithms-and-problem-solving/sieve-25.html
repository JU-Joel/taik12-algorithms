<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sieve(25) · step by step</title>
<style>
:root { --ink:#3F3F3F; --purple:#951A80; --purple-light:#F3E8F2; --teal:#2C7E91;
  --teal-light:#E2EFEE; --hl:#FFF3D1; --grey:#757679; --grey-light:#EAEAEA; }
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:#fff; }
main { max-width:1100px; margin:0 auto; padding:24px 16px 40px; }
h1 { font-size:28px; margin:0 0 4px; }
.src { color:var(--teal); font-weight:bold; margin:0 0 18px; }
.grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:20px; }
@media (max-width:760px) { .grid { grid-template-columns:1fr; } }
.panel { border:3px solid var(--purple-light); border-radius:14px; padding:16px; }
ol.code { font-family:"Courier New",monospace; font-size:18px; margin:0; padding-left:2.6em; }
ol.code li { padding:3px 8px; border-radius:6px; white-space:pre; }
ol.code li.now { background:var(--hl); outline:2px solid #C98B00; }
.kw { font-weight:bold; }
.cmt { font-family:"Courier New",monospace; font-size:16px; color:var(--grey); font-style:italic; margin:0 0 8px; white-space:pre-line; }
table { border-collapse:collapse; width:100%; font-size:18px; }
th, td { border-bottom:1px solid var(--grey-light); padding:6px 8px; text-align:right; }
th { color:var(--purple); text-align:right; }
.counter { font-size:22px; margin:12px 0 4px; }
.counter b { color:var(--purple); font-size:30px; }
.note { min-height:1.6em; font-style:italic; }
.controls { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 8px; }
button { font:inherit; font-size:18px; padding:10px 18px; border-radius:10px; border:2px solid var(--purple);
  background:#fff; color:var(--purple); cursor:pointer; }
button.primary { background:var(--purple); color:#fff; }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible { outline:3px solid var(--teal); outline-offset:2px; }
.pos { color:var(--grey); }
.result { margin-top:10px; font-weight:bold; }
</style></head>
<body><main>
<h1>Sieve(25)</h1>
<p class="src">ALGORITHM Sieve(n) · Levitin 1.1</p>
<div class="controls" role="group" aria-label="Step controls">
  <button id="reset">⏮ Start</button>
  <button id="back">◀ Back</button>
  <button id="next" class="primary">Next step ▶</button>
  <button id="play">▶ Play</button>
  <span class="pos" id="pos" aria-live="polite"></span>
</div>
<div class="grid">
  <section class="panel" aria-label="Pseudocode"><p class="cmt" id="cmt"></p><ol class="code" id="code"></ol></section>
  <section class="panel" aria-label="State">
    <table><thead><tr id="head"></tr></thead><tbody id="vars"></tbody></table>
    <p class="counter">crossings: <b id="count">0</b></p>
    <p class="note" id="note" aria-live="polite"></p>
    <p class="result" id="result" hidden>9 primes up to 25 after 18 crossings</p>
  </section>
</div>
<p class="pos">Keys: → or space = next step, ← = back. Every value comes from the same run as the lecture's trace table.</p>
</main>
<script>
const T = {"pseudocode": ["for p \u2190 2 to n do A[p] \u2190 p", "for p \u2190 2 to \u230a\u221an\u230b do", "    if A[p] \u2260 0", "        j \u2190 p \u2217 p", "        while j \u2264 n do", "            A[j] \u2190 0", "            j \u2190 j + p", "//copy the remaining elements of A to array L of the primes", "i \u2190 0", "for p \u2190 2 to n do", "    if A[p] \u2260 0", "        L[i] \u2190 A[p]", "        i \u2190 i + 1", "return L"], "columns": ["p", "j", "crossed out"], "comments": ["//Implements the sieve of Eratosthenes", "//Input: A positive integer n > 1", "//Output: Array L of all prime numbers less than or equal to n"], "steps": [{"line": 1, "state": {"p": "\u2013", "j": "\u2013", "crossed out": ""}, "counter": 0, "note": "A[2..25] holds 2..25"}, {"line": 2, "state": {"p": "2", "j": "\u2013", "crossed out": ""}, "counter": 0, "note": "p = 2"}, {"line": 4, "state": {"p": "2", "j": "4", "crossed out": ""}, "counter": 0, "note": "start at p\u00b7p = 4"}, {"line": 6, "state": {"p": "2", "j": "4", "crossed out": "4"}, "counter": 1, "note": "cross out 4"}, {"line": 7, "state": {"p": "2", "j": "6", "crossed out": "4"}, "counter": 1, "note": "next multiple 6"}, {"line": 6, "state": {"p": "2", "j": "6", "crossed out": "4 6"}, "counter": 2, "note": "cross out 6"}, {"line": 7, "state": {"p": "2", "j": "8", "crossed out": "4 6"}, "counter": 2, "note": "next multiple 8"}, {"line": 6, "state": {"p": "2", "j": "8", "crossed out": "4 6 8"}, "counter": 3, "note": "cross out 8"}, {"line": 7, "state": {"p": "2", "j": "10", "crossed out": "4 6 8"}, "counter": 3, "note": "next multiple 10"}, {"line": 6, "state": {"p": "2", "j": "10", "crossed out": "4 6 8 10"}, "counter": 4, "note": "cross out 10"}, {"line": 7, "state": {"p": "2", "j": "12", "crossed out": "4 6 8 10"}, "counter": 4, "note": "next multiple 12"}, {"line": 6, "state": {"p": "2", "j": "12", "crossed out": "4 6 8 10 12"}, "counter": 5, "note": "cross out 12"}, {"line": 7, "state": {"p": "2", "j": "14", "crossed out": "4 6 8 10 12"}, "counter": 5, "note": "next multiple 14"}, {"line": 6, "state": {"p": "2", "j": "14", "crossed out": "4 6 8 10 12 14"}, "counter": 6, "note": "cross out 14"}, {"line": 7, "state": {"p": "2", "j": "16", "crossed out": "4 6 8 10 12 14"}, "counter": 6, "note": "next multiple 16"}, {"line": 6, "state": {"p": "2", "j": "16", "crossed out": "6 8 10 12 14 16"}, "counter": 7, "note": "cross out 16"}, {"line": 7, "state": {"p": "2", "j": "18", "crossed out": "6 8 10 12 14 16"}, "counter": 7, "note": "next multiple 18"}, {"line": 6, "state": {"p": "2", "j": "18", "crossed out": "8 10 12 14 16 18"}, "counter": 8, "note": "cross out 18"}, {"line": 7, "state": {"p": "2", "j": "20", "crossed out": "8 10 12 14 16 18"}, "counter": 8, "note": "next multiple 20"}, {"line": 6, "state": {"p": "2", "j": "20", "crossed out": "10 12 14 16 18 20"}, "counter": 9, "note": "cross out 20"}, {"line": 7, "state": {"p": "2", "j": "22", "crossed out": "10 12 14 16 18 20"}, "counter": 9, "note": "next multiple 22"}, {"line": 6, "state": {"p": "2", "j": "22", "crossed out": "12 14 16 18 20 22"}, "counter": 10, "note": "cross out 22"}, {"line": 7, "state": {"p": "2", "j": "24", "crossed out": "12 14 16 18 20 22"}, "counter": 10, "note": "next multiple 24"}, {"line": 6, "state": {"p": "2", "j": "24", "crossed out": "14 16 18 20 22 24"}, "counter": 11, "note": "cross out 24"}, {"line": 7, "state": {"p": "2", "j": "26", "crossed out": "14 16 18 20 22 24"}, "counter": 11, "note": "next multiple 26"}, {"line": 2, "state": {"p": "3", "j": "\u2013", "crossed out": "14 16 18 20 22 24"}, "counter": 11, "note": "p = 3"}, {"line": 4, "state": {"p": "3", "j": "9", "crossed out": "14 16 18 20 22 24"}, "counter": 11, "note": "start at p\u00b7p = 9"}, {"line": 6, "state": {"p": "3", "j": "9", "crossed out": "16 18 20 22 24 9"}, "counter": 12, "note": "cross out 9"}, {"line": 7, "state": {"p": "3", "j": "12", "crossed out": "16 18 20 22 24 9"}, "counter": 12, "note": "next multiple 12"}, {"line": 6, "state": {"p": "3", "j": "12", "crossed out": "18 20 22 24 9 12"}, "counter": 13, "note": "cross out 12"}, {"line": 7, "state": {"p": "3", "j": "15", "crossed out": "18 20 22 24 9 12"}, "counter": 13, "note": "next multiple 15"}, {"line": 6, "state": {"p": "3", "j": "15", "crossed out": "20 22 24 9 12 15"}, "counter": 14, "note": "cross out 15"}, {"line": 7, "state": {"p": "3", "j": "18", "crossed out": "20 22 24 9 12 15"}, "counter": 14, "note": "next multiple 18"}, {"line": 6, "state": {"p": "3", "j": "18", "crossed out": "22 24 9 12 15 18"}, "counter": 15, "note": "cross out 18"}, {"line": 7, "state": {"p": "3", "j": "21", "crossed out": "22 24 9 12 15 18"}, "counter": 15, "note": "next multiple 21"}, {"line": 6, "state": {"p": "3", "j": "21", "crossed out": "24 9 12 15 18 21"}, "counter": 16, "note": "cross out 21"}, {"line": 7, "state": {"p": "3", "j": "24", "crossed out": "24 9 12 15 18 21"}, "counter": 16, "note": "next multiple 24"}, {"line": 6, "state": {"p": "3", "j": "24", "crossed out": "9 12 15 18 21 24"}, "counter": 17, "note": "cross out 24"}, {"line": 7, "state": {"p": "3", "j": "27", "crossed out": "9 12 15 18 21 24"}, "counter": 17, "note": "next multiple 27"}, {"line": 2, "state": {"p": "4", "j": "\u2013", "crossed out": "9 12 15 18 21 24"}, "counter": 17, "note": "p = 4"}, {"line": 3, "state": {"p": "4", "j": "\u2013", "crossed out": "9 12 15 18 21 24"}, "counter": 17, "note": "A[4] = 0: already crossed out, skip"}, {"line": 2, "state": {"p": "5", "j": "\u2013", "crossed out": "9 12 15 18 21 24"}, "counter": 17, "note": "p = 5"}, {"line": 4, "state": {"p": "5", "j": "25", "crossed out": "9 12 15 18 21 24"}, "counter": 17, "note": "start at p\u00b7p = 25"}, {"line": 6, "state": {"p": "5", "j": "25", "crossed out": "12 15 18 21 24 25"}, "counter": 18, "note": "cross out 25"}, {"line": 7, "state": {"p": "5", "j": "30", "crossed out": "12 15 18 21 24 25"}, "counter": 18, "note": "next multiple 30"}, {"line": 14, "state": {"p": "\u2013", "j": "\u2013", "crossed out": "12 15 18 21 24 25"}, "counter": 18, "note": "primes: 2 3 5 7 11 13 17 19 23"}]};
const KW = new Set(["ALGORITHM", "while", "do", "for", "to", "if", "else", "return", "and", "or", "not"]);
let i = 0, timer = null;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const code = document.getElementById('code');
T.pseudocode.forEach((line) => {
  const li = document.createElement('li');
  const indent = line.length - line.trimStart().length;
  li.textContent = '';
  li.append(' '.repeat(indent));
  line.trim().split(/(\b\w+\b)/).forEach((tok) => {
    if (KW.has(tok)) { const b = document.createElement('span'); b.className = 'kw'; b.textContent = tok; li.append(b); }
    else li.append(tok);
  });
  code.append(li);
});
document.getElementById('cmt').textContent = (T.comments || []).join('\n');
document.getElementById('head').innerHTML = '<th>variable</th><th>value</th>';
function show() {
  const s = T.steps[i];
  [...code.children].forEach((li, n) => li.classList.toggle('now', n + 1 === s.line));
  document.getElementById('vars').innerHTML = T.columns.map((c) =>
    `<tr><td style="text-align:left">${c}</td><td>${s.state[c] ?? '–'}</td></tr>`).join('');
  document.getElementById('count').textContent = s.counter;
  document.getElementById('note').textContent = s.note || '';
  document.getElementById('pos').textContent = `step ${i} of ${T.steps.length - 1} · line ${s.line}`;
  document.getElementById('back').disabled = i === 0;
  document.getElementById('next').disabled = i === T.steps.length - 1;
  document.getElementById('result').hidden = i !== T.steps.length - 1;
  if (i === T.steps.length - 1) stop();
}
function stop() { if (timer) { clearInterval(timer); timer = null; } document.getElementById('play').textContent = '▶ Play'; }
document.getElementById('next').onclick = () => { if (i < T.steps.length - 1) { i++; show(); } };
document.getElementById('back').onclick = () => { stop(); if (i > 0) { i--; show(); } };
document.getElementById('reset').onclick = () => { stop(); i = 0; show(); };
const play = document.getElementById('play');
if (reduce) { play.disabled = true; play.title = 'Play is off because your system asks for reduced motion'; }
play.onclick = () => {
  if (timer) { stop(); return; }
  if (i === T.steps.length - 1) i = 0;
  play.textContent = '⏸ Pause';
  timer = setInterval(() => { if (i < T.steps.length - 1) { i++; show(); } else stop(); }, 1100);
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); document.getElementById('next').click(); }
  if (e.key === 'ArrowLeft') document.getElementById('back').click();
});
show();
</script></body></html>
